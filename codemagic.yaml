workflows:
  himmah-ios-test:
    name: Himmah iOS Test Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate iOS and Android platform files
        script: |
          flutter create --platforms=ios,android --org com.himmah --project-name himmah .
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
      - flutter_drive.log

  himmah-android-apk:
    name: Himmah Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate iOS and Android platform files
        script: |
          flutter create --platforms=ios,android --org com.himmah --project-name himmah .
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
